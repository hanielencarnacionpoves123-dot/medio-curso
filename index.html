<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velox Market - Login</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/login.js" defer></script>
</head>
<body>

    <main class="contenedor" id="vista-login">

        <!-- LADO IZQUIERDO: producto -->
        <div class="izquierda">

            <p class="logo">VELOX MARKET</p>

            <img src="Reloj.png" alt="Reloj inteligente" class="reloj">

            <!-- Cuadro de texto que se sube encima del reloj -->
            <div class="cuadro">
                <h2>Edición Limitada Smart Tech</h2>
                <p>Inicia sesión hoy y obtén un 20% de descuento en tu primer pedido VIP.</p>
            </div>

            <p class="envios">Envíos express internacionales asegurados</p>

        </div>

        <!-- LADO DERECHO: formulario -->
        <div class="derecha">

            <h1>Iniciar Sesión HANIEL</h1>
            <p class="gris">Ingresa para ver tu carrito y pedidos</p>

            <div class="sociales">
                <button type="button" class="boton-social">Google</button>
                <button type="button" class="boton-social">Apple ID</button>
            </div>

            <p class="separador">O CON EMAIL</p>

            <form id="form-login" novalidate>
                <label for="usuario"><b>Correo Electrónico</b></label>
                <input type="email" id="usuario" name="usuario" placeholder="cliente@compras.com" autocomplete="username">

                <label for="password"><b>Contraseña</b></label>
                <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password">

                <button type="submit" class="boton-ingresar" id="boton-ingresar">Ingresar a mi Cuenta</button>
            </form>

        </div>

    </main>

    <!-- MODAL ERROR -->
    <div class="fondo-modal" id="modal-error" role="dialog" aria-modal="true" aria-labelledby="modal-error-titulo" hidden>
        <div class="modal-caja">
            <div class="modal-icono" aria-hidden="true">✕</div>
            <h2 id="modal-error-titulo">Usuario o contraseña incorrectos.</h2>
            <p class="gris" id="modal-error-texto">Intenta de nuevo.</p>
            <button type="button" class="boton-ingresar" id="boton-reintentar">Intentar de nuevo</button>
        </div>
    </div>

</body>
</html>
