<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velox Market - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Caja grande con 2 lados -->
    <div class="contenedor">

        <!-- LADO IZQUIERDO: producto -->
        <div class="izquierda">

            <p class="logo">VELOX MARKET</p>

            <img src="Reloj.png" alt="Reloj inteligente" class="reloj">

            <!-- Cuadro de texto que se sube encima del reloj -->
            <div class="cuadro">
                <h2>Edición Limitada Smart Tech</h2>
                <p>Inicia sesión hoy y obtén un 20% de descuento en tu primer pedido VIP.</p>
            </div>

            <p class="envios">Envíos express internacionales asegurados</p>

        </div>

        <!-- LADO DERECHO: formulario -->
        <div class="derecha">

            <h1>Iniciar Sesión HANIEL</h1>
            <p class="gris">Ingresa para ver tu carrito y pedidos</p>

            <div class="sociales">
                <button class="boton-social">Google</button>
                <button class="boton-social">Apple ID</button>
            </div>

            <p class="separador">O CON EMAIL</p>

            <p><b>Correo Electrónico</b></p>
            <input type="email" placeholder="cliente@compras.com">

            <p><b>Contraseña</b></p>
            <input type="password" placeholder="Contraseña">

            <button class="boton-ingresar">Ingresar a mi Cuenta</button>

        </div>

    </div>

</body>
</html>
